<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C6A51">
  <title>Pocket Ledger</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">Pocket Ledger</div>
      <div class="month">
        <button class="iconbtn" id="prev" aria-label="Previous month">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <span id="mlabel">—</span>
        <button class="iconbtn" id="next" aria-label="Next month">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <nav class="tabs" aria-label="Sections">
    <div class="in">
      <button class="tab" data-tab="month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4zM4 9h16M8 13h5M8 16h8"/></svg>
        Ledger
      </button>
      <button class="tab" data-tab="bills">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>
        Bills
      </button>
      <button class="fab" id="add" aria-label="Add income or expense">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-tab="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
        Report
      </button>
      <button class="tab" data-tab="more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        Export
      </button>
    </div>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toast" class="toast" hidden></div>
  <input type="file" id="restoreFile" accept="application/json,.json" hidden>

  <!-- Capacitor plugins (built from src/cap-entry.js). Must load before the app. -->
  <script src="cap.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
